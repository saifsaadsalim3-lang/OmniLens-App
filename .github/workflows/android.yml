name: Build OmniLens APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ جلب أكواد المشروع من GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2️⃣ إعداد بيئة Java JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3️⃣ إنشاء ملف gradlew تلقائياً في حال عدم وجوده ومنحه صلاحية التشغيل
      - name: Setup Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      # 4️⃣ بناء تطبيق الـ APK (Debug Build)
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      # 5️⃣ رفع ملف الـ APK لتنزيله مباشرة
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniLens-v1.9.1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
