name: Android CI Build Engine v3.0

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Run Auto-Injector (حقن التحديثات تلقائياً)
      run: |
        python3 -c "
        import os
        patch_file = 'patch.txt'
        target_file = 'app/src/main/java/com/omnilens/omniguard/MainActivity.kt'
        
        if os.path.exists(patch_file) and os.path.exists(target_file):
            print('🔍 تم العثور على ملف الحقن patch.txt.. جاري الدمج...')
            with open(patch_file, 'r', encoding='utf-8') as f:
                patch_code = f.read()
            with open(target_file, 'r', encoding='utf-8') as f:
                main_code = f.read()
            
            # استبدال أيقونة الشعار الافتراضية بالدالة الرسمية إذا وجدت
            if 'android.R.drawable.ic_lock_lock' in main_code:
                main_code = main_code.replace('android.R.drawable.ic_lock_lock', 'android.R.drawable.ic_menu_camera')
            
            # حقن الكود الجديد قبل القوس الأخير للملف
            last_brace_index = main_code.rfind('}')
            if last_brace_index != -1:
                updated_code = main_code[:last_brace_index] + '\n\n' + patch_code + '\n}'
                with open(target_file, 'w', encoding='utf-8') as f:
                    f.write(updated_code)
                print('✅ تم حقن التحديثات بنجاح داخل MainActivity.kt')
        else:
            print('ℹ️ لا يوجد ملف patch.txt، سيتم البناء كالمعتاد.')
        "

    - name: Build Gradle APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OmniLens-v3.0.0-APK
        path: app/build/outputs/apk/debug/app-debug.apk
